name: Retirement Pension News Crawler

on:
  schedule:
    - cron: '0 23 * * *'
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 저장소 소스코드 가져오기
        uses: actions/checkout@v4

      - name: 파이썬 실행 환경 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 뉴스 크롤러 실행
        run: python main.py

      - name: 변경된 index.html 업데이트
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Auto: Update pension news website" || exit 0
          git push
