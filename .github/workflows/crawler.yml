name: Retirement Pension News Crawler

on:
  schedule:
    # 매일 한국 시간 아침 8시 자동 실행 (UTC 기준 전날 23:00)
    - cron: '0 23 * * *'
  workflow_dispatch: # 버튼을 눌러 직접 실행도 가능하게 설정

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 파일 수정 및 저장 권한 부여

    steps:
      - name: 저장소 소스코드 가져오기
        uses: actions/checkout@v4

      - name: 파이썬 실행 환경 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 뉴스 크롤러 실행
        run: python main.py

      - name: 변경된 README.md 업데이트
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "Auto: Update pension news" || exit 0
          git push
